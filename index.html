<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة حرة - أقمشة الكنب | خشفة</title>
  <style>
    :root {
      --primary-color: #b8860b;
      --primary-hover: #966d09;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 25px;
    }

    header {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .badge {
      background-color: var(--primary-color);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    /* شريط الأدوات */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #f8f9fa;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px 8px 0 0;
      align-items: center;
    }

    .toolbar button, .toolbar select, .toolbar input[type="color"] {
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .toolbar button:hover {
      background: #e9ecef;
      border-color: #aaa;
    }

    .toolbar .separator {
      width: 1px;
      height: 24px;
      background: #ccc;
      margin: 0 4px;
    }

    /* منطقة محاكاة الورق الحراري (80mm) */
    .editor-wrapper {
      display: flex;
      justify-content: center;
      background: #e9ecef;
      padding: 20px;
      border: 1px solid var(--border-color);
      border-top: none;
      border-radius: 0 0 8px 8px;
    }

    .thermal-paper {
      width: 300px; /* يعادل عرض 80 مم مع الهوامش */
      min-height: 420px;
      background: #ffffff;
      padding: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      border: 1px solid #ddd;
      direction: rtl;
      font-size: 13px;
      line-height: 1.4;
      outline: none;
      overflow-y: auto;
    }

    .thermal-paper table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }

    .thermal-paper th, .thermal-paper td {
      border: 1px solid #000;
      padding: 4px;
      font-size: 12px;
      text-align: center;
    }

    .thermal-paper th {
      background-color: #f0f0f0;
    }

    /* أزرار الإجراءات */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-send {
      background-color: #28a745;
      color: white;
    }

    .btn-send:hover {
      background-color: #218838;
    }

    .btn-print {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-print:hover {
      background-color: var(--primary-hover);
    }

    .status-msg {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 0.9rem;
      text-align: center;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    /* إعدادات الطباعة المباشرة من المتصفح */
    @media print {
      body * {
        visibility: hidden;
      }
      .thermal-paper, .thermal-paper * {
        visibility: visible;
      }
      .thermal-paper {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm !important;
        padding: 2mm;
        margin: 0;
        border: none;
        box-shadow: none;
      }
      @page {
        size: 80mm auto;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>طباعة حرة - أقمشة الكنب</h1>
      <span class="badge">طابعة الإيصالات 80mm</span>
    </header>

    <!-- شريط أدوات التنسيق -->
    <div class="toolbar">
      <button onclick="execCmd('bold')" title="غمق"><b>B</b></button>
      <button onclick="execCmd('italic')" title="مائل"><i>I</i></button>
      <button onclick="execCmd('underline')" title="تحته خط"><u>U</u></button>
      <button onclick="execCmd('strikeThrough')" title="يتوسطه خط"><s>S</s></button>
      
      <div class="separator"></div>
      
      <button onclick="execCmd('justifyRight')" title="محاذاة لليمين">يمين</button>
      <button onclick="execCmd('justifyCenter')" title="محاذاة للوسط">وسط</button>
      <button onclick="execCmd('justifyLeft')" title="محاذاة لليسار">يسار</button>

      <div class="separator"></div>

      <button onclick="execCmd('insertUnorderedList')" title="قائمة نقطية">• قائمة</button>
      <button onclick="insertTable()" title="إدراج جدول">➕ جدول</button>

      <div class="separator"></div>

      <select onchange="execCmd('fontSize', this.value)" title="حجم الخط">
        <option value="2">صغير</option>
        <option value="3" selected>عادي</option>
        <option value="4">كبير</option>
        <option value="5">عريض جداً</option>
      </select>

      <input type="color" onchange="execCmd('foreColor', this.value)" title="لون النص">
    </div>

    <!-- منطقة المحرر المعاينة لعرض 80mm -->
    <div class="editor-wrapper">
      <div id="printArea" class="thermal-paper" contenteditable="true">
        <h3 style="text-align: center;">مفروشات خشفة</h3>
        <p style="text-align: center; font-size: 11px;">تجهيزات وأقمشة كنب فاخرة</p>
        <hr style="margin: 8px 0; border: 0.5px dashed #000;">
        <p><b>نوع القماش:</b> شانيل ممتاز</p>
        <p><b>اللون / الرمز:</b> ذهبي - KH-102</p>
        <p><b>الكمية المطلوبة:</b> 15 متر</p>
        <br>
        <table>
          <thead>
            <tr>
              <th>البند</th>
              <th>العدد</th>
              <th>الملاحظات</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>وسائد جانبية</td>
              <td>4</td>
              <td>حشوة مضغوطة</td>
            </tr>
          </tbody>
        </table>
        <br>
        <p style="text-align: center;">شكراً لتعاملكم معنا</p>
      </div>
    </div>

    <div id="statusMsg" class="status-msg status-success">تم إرسال أمر الطباعة بنجاح إلى اللاب توب!</div>

    <!-- أزرار العمليات -->
    <div class="actions">
      <button class="btn btn-send" onclick="sendToLaptop()">💻 إرسال للاب توب للطباعة</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ طباعة مباشرة</button>
    </div>
  </div>

  <script>
    // تنفيذ أوامر تنسيق النص الأساسية
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    // إدراج جدول متناسق مع 80mm
    function insertTable() {
      const rows = prompt("عدد الأسطر:", "3");
      const cols = prompt("عدد الأعمدة:", "2");
      
      if (rows && cols) {
        let tableHTML = '<table><thead><tr>';
        for (let j = 0; j < cols; j++) {
          tableHTML += `<th>عنوان ${j+1}</th>`;
        }
        tableHTML += '</tr></thead><tbody>';

        for (let i = 0; i < rows; i++) {
          tableHTML += '<tr>';
          for (let j = 0; j < cols; j++) {
            tableHTML += '<td>بيان</td>';
          }
          tableHTML += '</tr>';
        }
        tableHTML += 'tbody></table><br>';
        execCmd('insertHTML', tableHTML);
      }
    }

    // محاكاة إرسال الأمر للاب توب المربوط بالشبكة/السيرفر
    function sendToLaptop() {
      const content = document.getElementById('printArea').innerHTML;
      
      // هنا يمكن ربط الكود مع سيرفر Firebase أو WebSocket أو Local API الخاص باللاب توب
      console.log("المحتوى المرسل للاب توب:", content);

      // إظهار تنبيه النجاح
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.style.display = 'block';
      setTimeout(() => {
        statusMsg.style.display = 'none';
      }, 4000);
    }
  </script>
</body>
</html>
