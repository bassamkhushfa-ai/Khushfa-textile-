<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>khushfa textile</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F2A4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="khushfa textile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F3; --card:#FFFFFF; --ink:#1B2A34; --mute:#5E6E79; --line:#C9D3DA;
  --accent:#0F5C63; --accent-ink:#FFFFFF; --field:#F6F8F9; --danger:#A33A3A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11191E; --card:#1A252C; --ink:#E7EEF2; --mute:#98A9B4; --line:#2E3E48;
    --accent:#4FB3BC; --accent-ink:#0B1A1D; --field:#142026; --danger:#E08585;
  }
}
:root[data-theme="dark"]{
  --bg:#11191E; --card:#1A252C; --ink:#E7EEF2; --mute:#98A9B4; --line:#2E3E48;
  --accent:#4FB3BC; --accent-ink:#0B1A1D; --field:#142026; --danger:#E08585;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px 14px 90px}
.brand{display:flex;justify-content:center;margin:4px 0 6px}
.brand img{height:96px;width:auto;max-width:60%}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
h1,.sub{text-align:center}
h1{font-size:1.5rem;margin:6px 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.win{border-inline-start:5px solid var(--accent)}
.room-head{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.room-head>div{flex:1}
.w{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.room-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.room-foot b{color:var(--accent)}
.win-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.win-head h3{margin:0;font-size:1rem}
.unit{position:relative}
.unit input{padding-inline-end:42px}
.unit span{position:absolute;inset-inline-end:10px;top:36px;color:var(--mute);font-size:.85rem;pointer-events:none}
.calc{margin-top:10px;padding:9px 12px;background:var(--field);border-radius:8px;border:1px dashed var(--line);font-size:.95rem}
.calc b{color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:10px;min-height:46px;padding:0 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:500}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.del{border-color:var(--danger);color:var(--danger);min-height:38px;padding:0 12px;font-size:.9rem}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.bar button{flex:1 1 140px}
.total{font-weight:700}
.sign{height:70px}
[hidden]{display:none!important}
.chk{display:flex;gap:10px;flex-wrap:wrap}
.chk label{flex:1 1 100%;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.95rem;margin:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.chk input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pbtns button{flex:1 1 130px;min-height:44px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--field)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:2px;inset-inline-start:2px;min-height:0;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;line-height:1;font-size:18px}
.hid{display:none}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mcard{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:360px}
.mcard h3{margin:0 0 12px;font-size:1.05rem}
.locked [data-velvet]{display:none!important}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.tool{margin-bottom:14px}
#q{margin-bottom:12px}
.job-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.job h2{margin:0;font-size:1.1rem}
.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.job-meta{color:var(--mute);font-size:.9rem;margin-top:4px}
.job .bar{margin-top:12px}
.job .bar button{flex:1 1 100px}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line);background:var(--card);font-size:.95rem}
.status.ok{border-color:var(--accent);background:var(--field)}
.status b{color:var(--accent)}
.status button{min-height:40px;flex:0 0 auto}
#saveJob{flex:1 1 100%;min-height:52px;font-size:1.05rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag.cur{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tag.draft{background:var(--field);color:var(--mute);border:1px solid var(--line)}
.locked ::placeholder{color:transparent}
.locked [data-delwin],.locked [data-delroom],.locked [data-addwin],.locked #addRoom,.locked .pbtns,.locked [data-delphoto],.locked #reset,.locked #saveJob{display:none!important}
.locked input:disabled,.locked select:disabled,.locked textarea:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:transparent;border-style:dashed}
.hcard{display:flex;align-items:center;gap:16px;width:100%;min-height:132px;padding:12px 16px;margin-bottom:14px;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px}
.hcard img{width:104px;height:104px;flex:0 0 auto;border-radius:50%;object-fit:cover}
.hcard b{display:block;font-size:1.2rem}
.hcard small{display:block;color:var(--mute);font-size:.82rem}
.pricebox{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pricebox h3{margin:0 0 10px;font-size:1rem}
.pricebox .grid{align-items:end}
.pricebox .ln{padding:4px 0;border-bottom:1px dashed var(--line)}
.pricebox .tot{padding-top:8px;font-size:1.1rem}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#999;--field:#fff;--accent:#000}
  body{background:#fff;font-size:12px}
  .bar,.del,.noprint,.tool,#listView{display:none!important}
  section{break-inside:avoid;border-radius:0}
  .w{background:#fff;border-color:#bbb}
  .chk label{border:none;background:none;padding:0;min-height:0}
  main{padding:0;max-width:none}
  .logo-light{display:block!important}.logo-dark{display:none!important}
  .brand img{height:70px}
  input,select,textarea{border:none;border-bottom:1px solid #999;border-radius:0;padding:2px 0;min-height:0;background:transparent}
}

#ksRow{margin:6px 0 10px}
#ksBtn{min-height:38px;font-size:.85rem;padding:0 12px;border-radius:20px}
#ksModal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#ksModal[hidden]{display:none}
#ksBox{background:var(--card,#fff);color:var(--ink,#111);border-radius:16px;padding:16px;width:100%;max-width:380px;display:grid;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#ksBox h3{margin:0}
#ksMsg{font-size:.9rem;color:var(--danger,#b00020);min-height:1.2em}
.fday{margin:14px 0 6px;padding:8px 12px;border-radius:12px;background:rgba(128,128,128,.14);font-weight:700}
.fday small{display:block;font-weight:400;opacity:.8;margin-top:2px}
.fitem{border:1px solid rgba(128,128,128,.4);border-radius:12px;padding:10px;margin-bottom:10px}
.fitem-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
.fitem .fgrid{margin:0}
.fitem-v{margin-top:6px;font-size:.9rem;opacity:.85}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:block;font-size:13px;margin-bottom:3px}
.fgrid input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border-radius:10px;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit}
.frem{font-weight:700}
</style>
</head>

  function normPhone(raw){
    var d=String(raw||"").replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-0x660;}).replace(/[\u06F0-\u06F9]/g,function(c){return c.charCodeAt(0)-0x6F0;});
    d=d.replace(/[^\d]/g,"");
    if(d.indexOf("00963")===0)d=d.slice(2);
    else if(d.indexOf("00")===0)d=d.slice(2);
    else if(d.indexOf("963")===0){}
    else if(d.indexOf("0")===0)d="963"+d.slice(1);
    else d="963"+d;
    return d;
  }
  function needNamePhone(n,p){

    return {name:n,phone:normPhone(p)};
  }
  function doContact(n,p){
    var c=needNamePhone(n,p);if(!c)return;
    var v="BEGIN:VCARD\r\nVERSION:3.0\r\nN:;"+c.name+";;;\r\nFN:"+c.name+"\r\nTEL;TYPE=CELL:+"+c.phone+"\r\nEND:VCARD\r\n";
    var file=new File([v],"contact.vcf",{type:"text/vcard"});
    function fallback(){
      var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=c.name.replace(/[\\\/:*?"<>|]/g,"")+".vcf";
      document.body.appendChild(a);a.click();a.remove();
      alert("تم تنزيل ملف جهة الاتصال. افتحه من الإشعارات أو من مدير الملفات ثم اضغط حفظ.");
    }
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:c.name}).catch(function(e){if(e&&e.name!=="AbortError")fallback();});
    }else fallback();
  }
  function doThanks(n,p){

    window.open("https://wa.me/"+c.phone+"?text="+encodeURIComponent(msg),"_blank");
  }

      unsubs.push(fb.onSnapshot(fb.collection(fb.db,"users",uid,col),function(s){
        var arr=[];s.docChanges().forEach(function(c){if(c.type!=="removed")arr.push(c.doc);});
        if(arr.length)onDocs(col,arr);
      },function(e){lastErr=(e&&e.code)||"";}));
    });
  }

  /* ---------- start ---------- */
  Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]).then(function(m){
    var app=m[0].initializeApp(CFG),A=m[1],F=m[2];
    var auth=A.getAuth(app),db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
    catch(e){db=F.getFirestore(app);}
    fb={auth:auth,db:db,signIn:A.signInWithEmailAndPassword,signOut:A.signOut,doc:F.doc,setDoc:F.setDoc,collection:F.collection,onSnapshot:F.onSnapshot};
    state="ready";
    A.onAuthStateChanged(auth,function(u){
      if(u){
        uid=u.uid;email=u.email||"";
        if(meta.uid&&meta.uid!==uid)meta={jobs:{},fabs:{},uid:uid};
        meta.uid=uid;saveMeta();
        listen();push();
      }else{
        uid=null;email="";unsubs.forEach(function(f){try{f();}catch(e){}});unsubs=[];
      }
      badge();
    });
    badge();
  }).catch(function(e){state="unavailable";lastErr=(e&&e.message)||"";badge();});
})();
</script>
